<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Avançado de Entrevista de Emprego</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-soft: #e2e8f0;
            --panel: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --green: #16a34a;
            --orange: #d97706;
            --red: #dc2626;
            --purple: #7c3aed;
            --teal: #0f766e;
            --shadow: rgba(15, 23, 42, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 38%, #020817 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .container {
            background: rgba(255, 255, 255, 0.96);
            padding: 28px 30px;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        h1 {
            color: var(--bg-dark);
            text-align: center;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            margin: 0 0 20px;
            letter-spacing: -0.03em;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .timer-box {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border: 2px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 999px;
            color: var(--bg-dark);
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }

        .timer-warning {
            border-color: #ef4444;
            color: #b91c1c;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.55; }
            100% { opacity: 1; }
        }

        .meter-container {
            background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
            border-radius: 18px;
            padding: 4px;
            box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.12);
            margin-bottom: 20px;
        }

        .meter-bar {
            height: 26px;
            width: 50%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 14px;
            transition: width 0.5s ease-in-out, background-color 0.5s ease-in-out;
            text-align: right;
            padding-right: 12px;
            color: white;
            font-size: 13px;
            line-height: 26px;
            font-weight: 800;
            min-width: 60px;
        }

        .card {
            background: linear-gradient(180deg, #f8fafc, #f1f5f9);
            border: 1px solid #e2e8f0;
            border-left: 6px solid var(--blue);
            padding: 20px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .card h3 {
            margin: 0;
            color: #1e40af;
            font-size: clamp(1rem, 2vw, 1.3rem);
            line-height: 1.3;
        }

        .card p {
            line-height: 1.7;
            font-size: 15px;
            margin: 0;
            color: #334155;
        }

        .badge-peso {
            font-size: 11px;
            text-transform: uppercase;
            padding: 5px 9px;
            border-radius: 999px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .peso-baixo { background-color: #e0f2fe; color: #0369a1; }
        .peso-medio { background-color: #fef3c7; color: #b45309; }
        .peso-alto { background-color: #ffedd5; color: #c2410c; }
        .peso-critico { background-color: #fee2e2; color: #b91c1c; }

        .feedback {
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            font-weight: 600;
        }

        .feedback.show { display: block; }
        .feedback-positivo {
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #bbf7d0;
        }
        .feedback-neutro {
            background-color: #fef3c7;
            color: #78350f;
            border: 1px solid #fde68a;
        }
        .feedback-negativo {
            background-color: #fee2e2;
            color: #7f1d1d;
            border: 1px solid #fecaca;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 16px;
            margin: 12px 0;
            background: linear-gradient(180deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
        }

        .btn:disabled {
            background: linear-gradient(180deg, #94a3b8, #75849a);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .start-panel {
            display: grid;
            gap: 22px;
        }

        .hero-card {
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            border-left-color: var(--purple);
        }

        .hero-card h3 {
            color: var(--bg-dark);
        }

        .perfil-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .perfil-card {
            border: 2px solid #dbeafe;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .perfil-card:hover,
        .perfil-card.selecionado {
            border-color: var(--blue);
            box-shadow: 0 12px 20px rgba(37, 99, 235, 0.14);
            transform: translateY(-2px);
        }

        .perfil-card strong {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 15px;
            color: var(--bg-dark);
        }

        .perfil-card p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .cta-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, var(--green), #15803d);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(22, 163, 74, 0.25);
        }

        .cta-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .mini-card {
            padding: 16px 14px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .mini-card span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        .mini-card strong {
            font-size: 1.1rem;
            color: var(--bg-dark);
        }

        .resultado-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        :root {
            --bg-dark: #09070f;
            --bg-soft: #15111e;
            --panel: #17131f;
            --text: #f2eef8;
            --muted: #aaa1b8;
            --blue: #a78bfa;
            --blue-dark: #8b5cf6;
            --green: #a3e635;
            --purple: #a78bfa;
            --shadow: rgba(0, 0, 0, 0.42);
        }

        body {
            background-color: #08070b;
            background-image: linear-gradient(145deg, #171020 0%, #09070d 48%, #100b18 100%);
            color: var(--text);
            font-family: ui-rounded, 'Trebuchet MS', sans-serif;
        }

        .container {
            max-width: 900px;
            padding: 30px;
            background: rgba(17, 14, 23, 0.96);
            border: 1px solid #30263d;
            border-radius: 18px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), 0 0 50px rgba(124, 58, 237, 0.09);
        }

        h1 {
            color: #f7f2ff;
            text-align: left;
            margin-bottom: 24px;
            font-size: clamp(1.55rem, 3vw, 2.15rem);
        }

        .info-header { color: #c4b8d5; }

        .timer-box {
            background: #211a2b;
            border: 1px solid #49385c;
            color: #e7ddf5;
            box-shadow: none;
        }

        .meter-container {
            background: #292231;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .meter-bar {
            background: linear-gradient(90deg, #8b5cf6, #c084fc);
            text-align: right;
        }

        hr { border-top-color: #30263d !important; }

        .card,
        .container #conteudo-jogo > .card[style] {
            background: #1b1722 !important;
            border: 1px solid #393044;
            border-left: 4px solid #a78bfa;
            border-radius: 10px;
            box-shadow: none;
        }

        .card h3,
        .card p,
        .card strong,
        .card { color: #f2eef8; }

        .card p { color: #c6bdcf; }
        .card h3 { color: #d7c2ff; }

        .badge-peso { border-radius: 5px; }
        .peso-baixo { background: #18372e; color: #a7f3d0; }
        .peso-medio { background: #433319; color: #fcd98b; }
        .peso-alto { background: #482c1c; color: #fdba74; }
        .peso-critico { background: #49202d; color: #fda4af; }

        .feedback { border-radius: 8px; }
        .feedback-positivo { background: #14291f; color: #b8f2c9; border-color: #28543a; }
        .feedback-neutro { background: #342817; color: #f7d98a; border-color: #5c4722; }
        .feedback-negativo { background: #351b25; color: #ffc0ca; border-color: #63303e; }

        .btn {
            background: #211b2b;
            border: 1px solid #3c304b;
            border-radius: 8px;
            color: #eee8f5;
            box-shadow: none;
        }

        .btn:hover { background: #30243e; border-color: #9b72d5; }
        .btn:disabled { background: #25212a; color: #8f8799; }

        .start-panel .hero-card {
            background: linear-gradient(120deg, #241a32, #191520) !important;
            border-left-color: #b794f6;
        }

        .hero-card h3 { color: #e3d3ff; }

        .perfil-card {
            background: #191620;
            border: 1px solid #393044;
            border-radius: 8px;
            color: #f2eef8;
        }

        .perfil-card strong { color: #e8d7ff; }
        .perfil-card p { color: #b6adbf; }
        .perfil-card:hover,
        .perfil-card.selecionado {
            border-color: #b794f6;
            background: #211a2b;
            box-shadow: 0 0 0 2px rgba(183, 148, 246, 0.12);
        }

        .cta-btn {
            background: linear-gradient(110deg, #8b5cf6, #a855f7);
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.2);
        }

        .mini-card { background: #211b29; border-color: #393044; }
        .mini-card span { color: #b6adbf; }
        .mini-card strong { color: #f2eef8; }
        .resultado-badge { border-radius: 5px; }
        .status-aprovado { background: #173325; color: #a7f3c0; }
        .status-analise { background: #3a2c17; color: #f6d58b; }
        .status-reprovado { background: #3d2029; color: #f8b5c0; }

        .scene-stage {
            --scene-a: #382552;
            --scene-b: #191421;
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(210px, 0.85fr);
            align-items: center;
            gap: 20px;
            min-height: 230px;
            margin-bottom: 18px;
            padding: 20px 22px 12px;
            overflow: hidden;
            border: 1px solid #49375e;
            border-radius: 12px;
            background: linear-gradient(125deg, var(--scene-a), #211a2a 64%, var(--scene-b));
            transition: background 450ms ease;
        }

        .scene-stage::before {
            position: absolute;
            inset: auto 0 0;
            height: 46px;
            background: linear-gradient(180deg, transparent, rgba(5, 4, 8, 0.42));
            content: '';
            pointer-events: none;
        }

        .scene-stage[data-cenario="recepcao"] { --scene-a: #29404a; --scene-b: #392752; }
        .scene-stage[data-cenario="apresentacao"] { --scene-a: #3b2756; --scene-b: #25203a; }
        .scene-stage[data-cenario="equipe"] { --scene-a: #344150; --scene-b: #3d294a; }
        .scene-stage[data-cenario="cliente"] { --scene-a: #49313d; --scene-b: #28203a; }
        .scene-stage[data-cenario="planejamento"] { --scene-a: #29443f; --scene-b: #30294a; }
        .scene-stage[data-cenario="etica"] { --scene-a: #40333d; --scene-b: #29233e; }
        .scene-stage[data-cenario="negociacao"] { --scene-a: #4a3b2b; --scene-b: #302440; }
        .scene-stage[data-cenario="metas"] { --scene-a: #293e48; --scene-b: #3e2b4c; }
        .scene-stage[data-cenario="reuniao"] { --scene-a: #343550; --scene-b: #412c49; }
        .scene-stage[data-cenario="prioridades"] { --scene-a: #364332; --scene-b: #2d2544; }
        .scene-stage[data-cenario="stakeholders"] { --scene-a: #3b304a; --scene-b: #253a43; }
        .scene-stage[data-cenario="feedback"] { --scene-a: #49313b; --scene-b: #302443; }
        .scene-stage[data-cenario="processo"] { --scene-a: #283f47; --scene-b: #37294a; }
        .scene-stage[data-cenario="conversa"] { --scene-a: #45313f; --scene-b: #283b43; }
        .scene-stage[data-cenario="compliance"] { --scene-a: #343b4b; --scene-b: #432d48; }

        .scene-copy,
        .scene-characters { position: relative; z-index: 1; }

        .scene-kicker {
            margin: 0 0 10px;
            color: #d5baff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .speech-bubble {
            position: relative;
            margin: 0;
            padding: 13px 15px;
            border: 1px solid rgba(229, 213, 255, 0.24);
            border-radius: 10px;
            background: rgba(17, 13, 24, 0.76);
            color: #faf7ff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }

        .speech-bubble::after {
            position: absolute;
            right: 22px;
            bottom: -7px;
            width: 12px;
            height: 12px;
            border-right: 1px solid rgba(229, 213, 255, 0.24);
            border-bottom: 1px solid rgba(229, 213, 255, 0.24);
            background: #17131f;
            content: '';
            transform: rotate(45deg);
        }

        .scene-caption {
            margin: 12px 0 0;
            color: #d0c6dc;
            font-size: 12px;
        }

        .scene-characters {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 8px;
            align-self: end;
            min-width: 0;
        }

        .character {
            display: grid;
            justify-items: center;
            width: min(48%, 145px);
            margin: 0;
        }

        .character svg { display: block; width: 100%; height: auto; overflow: visible; }
        .character figcaption {
            margin-top: -2px;
            color: #e3d7f2;
            font-size: 11px;
            font-weight: 800;
        }

        .character .body-coat { fill: #7451a8; stroke: #160f20; stroke-width: 5; }
        .character.candidate .body-coat { fill: #446f78; }
        .character .shirt { fill: #f0e8f7; }
        .character .skin { fill: #d99b73; stroke: #211622; stroke-width: 4; }
        .character .hair { fill: #30212a; stroke: #211622; stroke-width: 4; }
        .character .eye { fill: #251c29; }
        .character .brow,
        .character .mouth { fill: none; stroke: #38232a; stroke-linecap: round; stroke-width: 4; }
        .character .mouth { display: none; }
        .character .face-curioso .brow-left { transform: rotate(-9deg); transform-origin: 77px 91px; }
        .character .face-curioso .brow-right { transform: rotate(9deg); transform-origin: 119px 91px; }
        .character .face-preocupado .brow-left { transform: rotate(12deg); transform-origin: 77px 91px; }
        .character .face-preocupado .brow-right { transform: rotate(-12deg); transform-origin: 119px 91px; }
        .character .face-confiante .brow-left { transform: rotate(-8deg); transform-origin: 77px 91px; }
        .character .face-confiante .brow-right { transform: rotate(-8deg); transform-origin: 119px 91px; }
        .character .face-pensativo .brow-left { transform: translateY(3px); }
        .character .face-pensativo .brow-right { transform: translateY(3px); }
        .character .face-curioso .mouth-curioso,
        .character .face-preocupado .mouth-preocupado,
        .character .face-confiante .mouth-confiante,
        .character .face-pensativo .mouth-pensativo { display: block; }

        #resposta-descritiva {
            background: #15121a;
            color: #f2eef8;
            border-color: #49385c !important;
        }
        #resposta-descritiva::placeholder { color: #8f869c; }

        @media (max-width: 640px) {
            .container { padding: 22px 18px; }
            h1 { text-align: center; }
            .scene-stage {
                grid-template-columns: 1fr;
                gap: 4px;
                min-height: 0;
                padding: 16px 14px 8px;
            }
            .scene-characters { max-width: 290px; margin: -4px auto 0; }
            .character { width: min(44%, 112px); }
            .speech-bubble { font-size: 13px; }
        }

        .status-aprovado {
            background: #dcfce7;
            color: #166534;
        }

        .status-analise {
            background: #fef3c7;
            color: #92400e;
        }

        .status-reprovado {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px 18px;
            }

            .info-header {
                justify-content: center;
                text-align: center;
            }

            .card-header {
                align-items: flex-start;
            }
        }

        .modo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .modo-card {
            display: grid;
            gap: 6px;
            min-height: 76px;
            padding: 14px;
            border: 1px solid #393044;
            border-radius: 8px;
            background: #191620;
            color: #f2eef8;
            text-align: left;
            cursor: pointer;
        }

        .modo-card strong { color: #e8d7ff; }
        .modo-card span { color: #b6adbf; font-size: 12px; line-height: 1.45; }
        .modo-card.selecionado { border-color: #b794f6; background: #251d30; }
        .modo-card:focus-visible,
        .perfil-card:focus-visible,
        .lobby-action:focus-visible,
        .move-key:focus-visible { outline: 2px solid #d7baff; outline-offset: 3px; }

        .lobby-panel {
            overflow: hidden;
            border: 1px solid #49375e;
            border-radius: 10px;
            background: #100e14;
        }

        .lobby-heading {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: baseline;
            padding: 12px 15px;
            color: #e4d7f4;
            font-size: 12px;
        }

        .lobby-heading strong { color: #d5baff; }
        .lobby-canvas-wrap { position: relative; overflow: hidden; background: #17151a; }
        #lobby-canvas,
        .scene-art {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        #lobby-canvas { touch-action: none; }

        .lobby-dialog {
            min-height: 54px;
            padding: 12px 15px;
            border-top: 1px solid #30263d;
            color: #e9e1f1;
            font-size: 13px;
            line-height: 1.5;
        }

        .lobby-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 15px 14px;
        }

        .lobby-action {
            width: auto;
            margin: 0;
            padding: 9px 13px;
            border-radius: 6px;
            background: #292033;
            font-size: 12px;
        }

        .lobby-action.primary { background: #8152c2; border-color: #a477df; }
        .lobby-action:disabled { opacity: 0.42; }

        .lobby-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 0 15px 14px;
            color: #aaa1b8;
            font-size: 11px;
        }

        .move-pad { display: none; grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(2, 34px); gap: 4px; }
        .move-key {
            border: 1px solid #49385c;
            border-radius: 5px;
            background: #211a2b;
            color: #eee8f5;
            font-weight: 800;
            touch-action: none;
        }
        .move-key[data-dir="up"] { grid-column: 2; }

    function drawPixelCharacter(
        context,
        x,
        baseline,
        coat,
        expression = 'neutral',
        time = 0,
        scale = 1,
        walking = false,
        speaking = false
    ) {
        const unit = 7 * scale;
        const walkPhase = time * 11;
        const stride = walking ? Math.sin(walkPhase) : Math.sin(time * 2.2) * 0.08;
        const bounce = walking ? Math.abs(Math.sin(walkPhase)) * 1.5 : Math.sin(time * 2.4) * 0.55;
        const blink = Math.sin(time * 1.7 + 0.8) > 0.994;
        const block = (column, row, width, height, color) => {
            context.fillStyle = color;
            context.fillRect(
                Math.round(x + column * unit),
                Math.round(baseline + row * unit),
                width * unit,
                height * unit
            );
        };

        context.fillStyle = 'rgba(10, 8, 12, 0.28)';
        context.beginPath();
        context.ellipse(
            x + unit * 5,
            baseline + unit * 18,
            unit * (6 - bounce * 0.12),
            unit * 1.1,
            0,
            0,
            Math.PI * 2
        );
        context.fill();

        const leftLegY = Math.max(0, Math.round(stride * 1.4));
        const rightLegY = Math.max(0, Math.round(-stride * 1.4));
        block(2, 13 + leftLegY, 2, 4 - leftLegY, '#29252c');
        block(6, 13 + rightLegY, 2, 4 - rightLegY, '#29252c');
        block(1, 17 + leftLegY, 3, 1, '#15141a');
        block(6, 17 + rightLegY, 3, 1, '#15141a');

        const bodyBob = Math.round(bounce * 0.35);
        const armSwing = walking ? Math.round(stride) : 0;
        block(1, 7 + bodyBob, 8, 6, '#17141c');
        block(2, 6 + bodyBob, 7, 7, coat);
        block(1, 7 + bodyBob + armSwing, 2, 4, coat);
        block(0, 10 + bodyBob + armSwing, 2, 2, '#d59b76');
        block(8, 7 + bodyBob - armSwing, 2, 4, coat);
        block(8, 10 + bodyBob - armSwing, 2, 2, '#d59b76');
        block(2, 7 + bodyBob, 1, 5, 'rgba(255, 255, 255, 0.2)');
        block(8, 7 + bodyBob, 1, 5, 'rgba(10, 8, 14, 0.24)');
        block(4, 7 + bodyBob, 2, 6, '#f0e9e0');
        block(3, 6 + bodyBob, 2, 2, '#d59b76');
        block(6, 6 + bodyBob, 2, 2, '#d59b76');
        block(4, 9 + bodyBob, 2, 1, '#8b5e91');
        block(4, 11 + bodyBob, 1, 1, '#d7c7e4');
        block(6, 8 + bodyBob, 2, 2, '#d5c49f');
        block(6, 8 + bodyBob, 1, 1, '#f3e3b9');

        const headBob = Math.round(bounce * 0.45);
        block(3, 2 + headBob, 5, 5, '#b87556');
        block(2, 3 + headBob, 1, 3, '#d59b76');
        block(8, 3 + headBob, 1, 3, '#d59b76');
        block(3, 2 + headBob, 5, 1, '#edb48e');
        block(2, 1 + headBob, 7, 2, '#30252a');
        block(2, 2 + headBob, 2, 3, '#30252a');
        block(7, 2 + headBob, 2, 2, '#30252a');
        block(4, 3 + headBob, 2, 1, '#30252a');
        block(7, 4 + headBob, 1, 1, '#30252a');
        block(3, 5 + headBob, 1, 1, '#e18a78');

        block(4, 4 + headBob, 1, blink ? 1 : 2, '#f7eee5');
        block(7, 4 + headBob, 1, blink ? 1 : 2, '#f7eee5');
        if (!blink) {
            block(4, 4 + headBob, 1, 1, '#211a20');
            block(7, 4 + headBob, 1, 1, '#211a20');
        }
        if (expression === 'worried') {
            block(3, 3 + headBob, 2, 1, '#30252a');
            block(7, 3 + headBob, 2, 1, '#30252a');
            block(5, 6 + headBob, 2, 1, '#7a3637');
        } else if (expression === 'happy') {
            block(3, 3 + headBob, 2, 1, '#30252a');
            block(7, 3 + headBob, 2, 1, '#30252a');
            block(5, 6 + headBob, 2, 1, '#7a3637');
            block(5, 6 + headBob, 1, 1, '#f4d7c4');
        } else if (speaking && Math.sin(time * 9) > 0.2) {
            block(5, 6 + headBob, 2, 2, '#542b35');
            block(5, 6 + headBob, 2, 1, '#f4d7c4');
        } else {
            block(5, 6 + headBob, 2, 1, '#8f4f4a');
        }
    }

    function drawQuestionScene(canvas, sceneKey, time = tempoAnimacao) {
        if (!canvas) return;
        const context = canvas.getContext('2d');
        drawOfficeRoom(context, sceneKey);
        if (sceneKey !== 'recepcao') {
            drawPixelCharacter(context, 690, 354, '#73529a', 'neutral', time, 1.25, false, true);
            drawPixelCharacter(context, 790, 368, '#416d76', 'happy', time + 0.4, 1.25);

    function drawLobby(canvas) {
        if (!canvas) return;
        const context = canvas.getContext('2d');
        drawOfficeRoom(context, 'recepcao');

        personagensLobby.forEach(personagem => {
            if (!personagem.ativo) return;
            drawPixelCharacter(
                context,
                personagem.x - 35,
                personagem.y,
                personagem.cor,
                personagem.id === 'ana' ? 'neutral' : 'happy',
                tempoAnimacao + personagem.x / 300,
                Math.max(0.8, personagem.y / 350),
                personagem.id !== 'ana' && faseJogo === 'aproximando',
                personagem.id === 'ana'
            );
            context.font = 'bold 15px ui-rounded, sans-serif';
            context.textAlign = 'center';
            context.fillStyle = 'rgba(15, 12, 19, 0.82)';
            context.fillRect(personagem.x - 46, personagem.y - 27, 92, 22);
            context.fillStyle = '#f2eafb';
            context.fillText(personagem.nome, personagem.x, personagem.y - 11);
        });

        const playerScale = Math.max(0.82, jogadorLobby.y / 350);
        drawPixelCharacter(
            context,
            jogadorLobby.x - 35,
            jogadorLobby.y,
            '#416d76',
            faseJogo === 'conversa' ? 'happy' : 'neutral',
            tempoAnimacao,
            playerScale,
            movimentoJogador || faseJogo === 'aproximando'
        );
        context.font = 'bold 15px ui-rounded, sans-serif';
        context.textAlign = 'center';
        context.fillStyle = 'rgba(15, 12, 19, 0.82)';
        context.fillRect(jogadorLobby.x - 43, jogadorLobby.y - 27, 86, 22);
        context.fillStyle = '#f2eafb';
        context.fillText(nomeJogador, jogadorLobby.x, jogadorLobby.y - 11);
    }

    function distanciaJogador(personagem) {
        return Math.hypot(jogadorLobby.x - personagem.x, jogadorLobby.y - personagem.y);
    }

    function atualizarInteracoesLobby() {
        const podeConversar = faseJogo === 'lobby';
        personagensLobby.forEach(personagem => {
            const botao = document.querySelector(`[data-interagir="${personagem.id}"]`);
            if (botao) {
                botao.disabled = !podeConversar || !personagem.ativo || distanciaJogador(personagem) > 125;
            }
        });

        const iniciar = document.getElementById('lobby-start');
        if (iniciar) iniciar.hidden = faseJogo !== 'conversa';
        const hint = document.getElementById('lobby-hint');
        if (hint) {
            hint.innerText = faseJogo === 'lobby'
                ? 'Aproxime-se de alguém para conversar. Use WASD ou as setas.'
                : faseJogo === 'aproximando'
                    ? 'Ana chamou você para a entrevista...'
                    : 'A entrevista está pronta para começar.';
        }
    }

    function conversarCom(personagemId) {
        if (faseJogo !== 'lobby') return;
        const personagem = personagensLobby.find(item => item.id === personagemId && item.ativo);
        if (!personagem || distanciaJogador(personagem) > 125) return;

        if (personagemId === 'ana') {
            faseJogo = 'aproximando';
            dialogoLobby = 'Ana: Boa tarde! Estávamos esperando você. Pode vir comigo, vamos começar a entrevista.';
        } else {
            const fala = personagemId === 'marina'
                ? 'Marina: Boa tarde! Sou a Marina, cuido da recepção. A Ana está na sala ao lado.'
                : 'Rafael: Boa tarde! Sou o Rafael, também estou aguardando. Boa sorte na entrevista!';
            dialogoLobby = fala;
        }

        const dialogo = document.getElementById('lobby-dialog');
        if (dialogo) dialogo.innerText = dialogoLobby;
        atualizarInteracoesLobby();
    }

    function interagirMaisProximo() {
        const maisProximo = personagensLobby
            .filter(personagem => personagem.ativo)
            .sort((a, b) => distanciaJogador(a) - distanciaJogador(b))[0];
        if (maisProximo && distanciaJogador(maisProximo) <= 125) conversarCom(maisProximo.id);
    }

    function atualizarLobbyFrame(timestamp) {
        if (faseJogo !== 'lobby' && faseJogo !== 'aproximando' && faseJogo !== 'conversa') {
            lobbyAnimation = null;
            return;
        }

        const delta = Math.min(timestamp - (lastLobbyFrame || timestamp), 32);
        lastLobbyFrame = timestamp;

        if (faseJogo === 'lobby') {
            const horizontal = Number(teclaMovimento.has('d') || teclaMovimento.has('arrowright')) - Number(teclaMovimento.has('a') || teclaMovimento.has('arrowleft'));
            const vertical = Number(teclaMovimento.has('s') || teclaMovimento.has('arrowdown')) - Number(teclaMovimento.has('w') || teclaMovimento.has('arrowup'));
            const magnitude = Math.hypot(horizontal, vertical) || 1;
            if (horizontal || vertical) {
                jogadorLobby.x = Math.max(55, Math.min(905, jogadorLobby.x + horizontal / magnitude * delta * 0.24));
                jogadorLobby.y = Math.max(287, Math.min(412, jogadorLobby.y + vertical / magnitude * delta * 0.18));
                framePersonagem += 1;
            }
        } else if (faseJogo === 'aproximando') {
            jogadorLobby.x = Math.min(655, jogadorLobby.x + delta * 0.12);
            jogadorLobby.y += (318 - jogadorLobby.y) * Math.min(1, delta * 0.004);
            personagensLobby.filter(personagem => personagem.id !== 'ana' && personagem.ativo).forEach(personagem => {
                personagem.x -= delta * 0.22;
                if (personagem.x < -100) personagem.ativo = false;
            });
            if (jogadorLobby.x >= 650) {
                faseJogo = 'conversa';
                dialogoLobby = 'Você: Boa tarde, Ana. Obrigado por me receber.\nAna: Boa tarde! Fique à vontade. Vamos conversar.';
                const dialogo = document.getElementById('lobby-dialog');
                if (dialogo) dialogo.innerText = dialogoLobby;
                atualizarInteracoesLobby();
            }
            framePersonagem += 1;
        }

        const canvas = document.getElementById('lobby-canvas');
        drawLobby(canvas);
        atualizarInteracoesLobby();
        lobbyAnimation = requestAnimationFrame(atualizarLobbyFrame);
    }

        `;

        document.querySelectorAll('[data-interagir]').forEach(botao => {
            botao.addEventListener('click', () => conversarCom(botao.dataset.interagir));
        });
        document.getElementById('lobby-start').addEventListener('click', iniciarEntrevista);
        document.querySelectorAll('.move-key').forEach(botao => {
            const direcoes = { up: 'w', left: 'a', down: 's', right: 'd' };
            const pressionar = event => {
                event.preventDefault();
                teclaMovimento.add(direcoes[botao.dataset.dir]);
            };
            const soltar = () => teclaMovimento.delete(direcoes[botao.dataset.dir]);
            botao.addEventListener('pointerdown', pressionar);
            botao.addEventListener('pointerup', soltar);
            botao.addEventListener('pointercancel', soltar);
            botao.addEventListener('pointerleave', soltar);
        });

        drawLobby(document.getElementById('lobby-canvas'));
        atualizarInteracoesLobby();
        if (lobbyAnimation) cancelAnimationFrame(lobbyAnimation);
        lastLobbyFrame = 0;
        lobbyAnimation = requestAnimationFrame(atualizarLobbyFrame);
    }

    function iniciarEntrevista() {
        faseJogo = 'entrevista';
        if (lobbyAnimation) cancelAnimationFrame(lobbyAnimation);
        document.getElementById('timer-box').style.display = 'flex';
        carregarCena();

    function embaralharTodasOpcoes() {
        cenas.forEach(cena => {
            if (cena.tipo === 'objetiva') {
                embaralharArray(cena.opcoes);
            }
        });
        perguntasExtrasNervosismo.forEach(cena => {
            if (cena.tipo === 'objetiva') {
                embaralharArray(cena.opcoes);
            }
        });
    }

    function limitarPontuacao(valor) {
        return Math.min(100, Math.max(0, valor));
    }

    function atualizarBarra() {
        const barra = document.getElementById('barra-admissao');
        taxaAdmissao = limitarPontuacao(taxaAdmissao);
        barra.style.width = `${taxaAdmissao}%`;
        barra.innerText = `${taxaAdmissao}%`;

        if (taxaAdmissao >= 85) {
            barra.style.backgroundColor = '#16a34a';
        } else if (taxaAdmissao >= 65) {
            barra.style.backgroundColor = '#d97706';
        } else {
            barra.style.backgroundColor = '#dc2626';
        }
    }

    function iniciarTemporizador() {
        pararTemporizador();
        const cenaAtualObj = cenas[cenaAtual];
        tempoRestante = cenaAtualObj && cenaAtualObj.tipo === 'descritiva' ? TEMPO_POR_TIPO.descritiva : TEMPO_POR_TIPO.objetiva;
        const timerElem = document.getElementById('tempo-restante');
        const timerBox = document.getElementById('timer-box');

        timerElem.innerText = tempoRestante;
        timerBox.classList.remove('timer-warning');

        timerInterval = setInterval(() => {
            tempoRestante--;
            timerElem.innerText = tempoRestante;

            if (tempoRestante <= 10) {
                timerBox.classList.add('timer-warning');
            }

            if (tempoRestante <= 0) {
                pararTemporizador();
                tratarTempoEsgotado();
            }
        }, 1000);
    }

    function pararTemporizador() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function renderInicio() {
        const conteudo = document.getElementById('conteudo-jogo');
        conteudo.innerHTML = `
            <div class="start-panel">
                <div class="card hero-card">
                    <h3>Escolha o perfil da sua simulação</h3>
                    <p>Explore a recepção, converse com a equipe e escolha como quer fazer a entrevista.</p>
                </div>

                <div class="perfil-grid">
                    ${Object.entries(perfis).map(([key, perfil]) => `
                        <button class="perfil-card ${perfilSelecionado === key ? 'selecionado' : ''}" data-perfil="${key}">
                            <strong>${perfil.label}</strong>
                            <p>${perfil.descricao}</p>
                        </button>
                    `).join('')}
                </div>

                <div class="modo-grid" role="group" aria-label="Formato da entrevista">
                    <button class="modo-card ${modoSelecionado === 'completo' ? 'selecionado' : ''}" data-modo="completo" aria-pressed="${modoSelecionado === 'completo'}">
                        <strong>Simulado completo</strong>
                        <span>12 perguntas rápidas + 2 respostas curtas</span>
                    </button>
                    <button class="modo-card ${modoSelecionado === 'rapidas' ? 'selecionado' : ''}" data-modo="rapidas" aria-pressed="${modoSelecionado === 'rapidas'}">
                        <strong>Só perguntas rápidas</strong>
                        <span>12 perguntas objetivas, sem texto longo</span>
                    </button>
                </div>

                <button id="btn-iniciar" class="cta-btn">Entrar na recepção</button>
            </div>
        `;

        document.querySelectorAll('.perfil-card').forEach(botao => {
            botao.addEventListener('click', () => {
                perfilSelecionado = botao.dataset.perfil;
                renderInicio();
            });
        });

        document.querySelectorAll('.modo-card').forEach(botao => {
            botao.addEventListener('click', () => {
                modoSelecionado = botao.dataset.modo;
                renderInicio();
            });
        });

        document.getElementById('btn-iniciar').addEventListener('click', () => {
            taxaAdmissao = 50 + perfis[perfilSelecionado].bonus;
            historico = [];
            cenaAtual = 0;
            cenas = perguntas.filter(pergunta => modoSelecionado === 'completo' || pergunta.tipo === 'objetiva');
            embaralharTodasOpcoes();
            atualizarBarra();
            faseJogo = 'lobby';
            renderLobby();
        });
    }

    function gerarFeedbackDescritivo(texto, pergunta) {
        const normalizado = texto
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');

        const palavrasChave = pergunta.palavrasChave.map(chave => chave.toLowerCase());
        const keywordsEncontradas = palavrasChave.filter(chave => normalizado.includes(chave));

        const termosProfissionais = [
            'processo', 'cliente', 'equipe', 'metrica', 'metricas', 'risco', 'prioridade', 'diagnostico', 'solucao', 'acao',
            'acompanhamento', 'documentacao', 'compliance', 'responsabilidade', 'impacto', 'resultado', 'correcao', 'mitigacao',
            'ferramenta', 'indicador', 'entregavel', 'plano', 'estrategia', 'aprendizado', 'crise'
        ];

        const verbosAcao = [
            'identifico', 'analis', 'map', 'prioriz', 'document', 'aplic', 'comunico', 'defino', 'corrig', 'mitig',
            'acompanho', 'reviso', 'estabelec', 'registro', 'monit', 'conduz', 'avali', 'planej', 'alinh'
        ];

        const conectores = ['porque', 'pois', 'entao', 'logo', 'portanto', 'quando', 'enquanto', 'assim', 'como resultado', 'para'];
        const termosProfissionaisEncontrados = termosProfissionais.filter(termo => normalizado.includes(termo)).length;
        const verbosEncontrados = verbosAcao.filter(verbo => normalizado.includes(verbo)).length;
        const conectoresEncontrados = conectores.filter(conector => normalizado.includes(conector)).length;
        const temQuantidade = texto.trim().length >= pergunta.minimoCaracteres;
        const respostaGenerica = /(lorem ipsum|qualquer coisa|teste|bla|asdf|texto|aleatorio|copiar|colar)/i.test(texto);
        const repeticaoExcessiva = ((normalizado.match(/\b\w+\b/g) || []).filter(palavra => palavra.length > 3).length >= 200);

        if (respostaGenerica || repeticaoExcessiva) {
            return {
                impacto: -20,
                tipo: 'negativo',
                mensagem: 'Resposta inadequada: o texto não apresentou raciocínio profissional suficiente, contexto real de negócio e ação estruturada (-20%).'
            };
        }

        if (temQuantidade && keywordsEncontradas.length >= 4 && termosProfissionaisEncontrados >= 4 && verbosEncontrados >= 2 && conectoresEncontrados >= 1) {
            return {
                impacto: 18,
                tipo: 'positivo',
                mensagem: 'Resposta sólida: você mostrou análise profissional, ação concreta, senso de risco e solução prática (+18%).'
            };
        }

        if (temQuantidade && keywordsEncontradas.length >= 2 && termosProfissionaisEncontrados >= 2 && verbosEncontrados >= 1) {
            return {
                impacto: 5,
                tipo: 'neutro',
                mensagem: 'Resposta aceitável, mas ainda falta aprofundamento em diagnóstico, prioridade e mecanismo de correção (+5%).'
            };
        }

        return {
            impacto: -12,
            tipo: 'negativo',
            mensagem: 'Sua resposta ficou superficial. O texto precisava mostrar contexto profissional, ação concreta e solução orientada a impacto (-12%).'
        };
    }

    function carregarCena() {
        const feedbackBox = document.getElementById('feedback-box');
        if (feedbackBox) {
            feedbackBox.className = 'feedback';
        }

        if (cenaAtual >= cenas.length) {
            exibirResultadoFinal();
            return;
        }

        const cena = cenas[cenaAtual];
        const conteudo = document.getElementById('conteudo-jogo');
        const visual = renderCenaVisual();

        if (cena.tipo === 'objetiva') {
            conteudo.innerHTML = `
            ${visual}
                <div class="card">
                    <div class="card-header">
                        <h3>${cena.titulo}</h3>
                        <span class="badge-peso ${cena.classePeso}">Peso: ${cena.peso}</span>
                    </div>
                    <p>${cena.texto}</p>
                </div>

                <div id="feedback-box" class="feedback"></div>
                <div id="opcoes-box">
                    ${cena.opcoes.map((opcao, index) => `
                        <button class="btn" data-index="${index}">${opcao.texto}</button>
                    `).join('')}
                </div>
            `;

            document.querySelectorAll('.btn').forEach(botao => {
                botao.addEventListener('click', () => {
                    const opcao = cena.opcoes[Number(botao.dataset.index)];
                    processarEscolha(opcao);
                });
            });
        } else {
            conteudo.innerHTML = `
                ${visual}
                <div class="card">
                    <div class="card-header">
                        <h3>${cena.titulo}</h3>
                        <span class="badge-peso ${cena.classePeso}">Peso: ${cena.peso}</span>
                    </div>
                    <p>${cena.texto}</p>
                </div>

                <div id="feedback-box" class="feedback"></div>

                <label class="resposta-label" for="resposta-descritiva">Sua resposta (até 3 linhas)</label>
                <textarea id="resposta-descritiva" rows="3" maxlength="360" style="width:100%; border:1px solid #cbd5e1; border-radius:12px; padding:14px; font-size:14px; resize:vertical; margin-bottom:12px;" placeholder="Escreva de forma direta, em poucas linhas..."></textarea>
                <button id="btn-responder" class="cta-btn">Enviar resposta</button>
            `;

            document.getElementById('btn-responder').addEventListener('click', () => {
                const texto = document.getElementById('resposta-descritiva').value.trim();
                if (!texto) {
                    const feedbackBox = document.getElementById('feedback-box');
                    feedbackBox.innerText = 'É necessário escrever uma resposta para continuar.';
                    feedbackBox.className = 'feedback show feedback-neutro';
                    return;
                }

                const avaliacao = gerarFeedbackDescritivo(texto, cena);
                processarRespostaDescritiva(avaliacao, texto);
            });
        }

        document.querySelectorAll('.scene-stage').forEach(stage => {
            drawQuestionScene(stage.querySelector('.scene-art'), stage.dataset.cenario);
        });

        document.getElementById('etapa-texto').innerText = `Etapa: ${cenaAtual + 1} de ${cenas.length}`;
        iniciarTemporizador();
    }

    function processarEscolha(opcao) {
        pararTemporizador();
        taxaAdmissao += opcao.impacto;
        atualizarBarra();

        historico.push({
            titulo: cenas[cenaAtual].titulo,
            impacto: opcao.impacto,
            tipo: opcao.tipo,
            texto: opcao.texto
        });

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.innerText = `[Impacto: ${opcao.impacto > 0 ? '+' + opcao.impacto : opcao.impacto}%] ${opcao.consequencia}`;
        feedbackBox.className = `feedback show feedback-${opcao.tipo}`;

        document.querySelectorAll('.btn').forEach(b => b.disabled = true);

        setTimeout(() => {
            cenaAtual += 1;
            carregarCena();
        }, 2500);
    }

    function processarRespostaDescritiva(avaliacao, texto) {
        pararTemporizador();
        taxaAdmissao += avaliacao.impacto;
        atualizarBarra();

        historico.push({
            titulo: cenas[cenaAtual].titulo,
            impacto: avaliacao.impacto,
            tipo: 'descritiva',
            texto
        });

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.innerText = avaliacao.mensagem;
        feedbackBox.className = `feedback show feedback-${avaliacao.tipo}`;

        document.getElementById('btn-responder').disabled = true;
        document.getElementById('resposta-descritiva').disabled = true;

        setTimeout(() => {
            cenaAtual += 1;
            carregarCena();
        }, 2500);
    }

    function tratarTempoEsgotado() {
        const cenaAtualObj = cenas[cenaAtual];
        if (cenaAtualObj.tipo === 'objetiva') {
            document.querySelectorAll('.btn').forEach(b => b.disabled = true);
        } else {
            const campo = document.getElementById('resposta-descritiva');
            const botao = document.getElementById('btn-responder');
            if (campo) campo.disabled = true;
            if (botao) botao.disabled = true;
        }

        let punicao = -15;
        let mensagem = '⏱️ Tempo esgotado! Sua resposta foi insuficiente e a avaliação penalizou sua pontuação.';

        if (cenaAtualObj.classePeso === 'peso-critico') {
            punicao = -30;
            mensagem = '⏱️ Tempo esgotado! Em uma questão crítica, a hesitação foi interpretada como falta de firmeza (-30%).';
        } else if (cenaAtualObj.tipo === 'descritiva') {
            mensagem = '⏱️ Tempo esgotado! Sua resposta não foi concluída a tempo e a pontuação caiu por falta de profundidade (-15%).';
        }

        taxaAdmissao += punicao;
        atualizarBarra();

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.innerText = mensagem;
        feedbackBox.className = 'feedback show feedback-negativo';

        setTimeout(() => {
            cenaAtual += 1;
            carregarCena();
        }, 2500);
    }

    function exibirResultadoFinal() {
        pararTemporizador();
        document.getElementById('timer-box').style.display = 'none';

        const positivas = historico.filter(item => item.impacto > 0).length;
        const negativas = historico.filter(item => item.impacto < 0).length;
        const neutras = historico.filter(item => item.impacto === 0).length;
        const melhor = [...historico].sort((a, b) => b.impacto - a.impacto)[0];
        const pior = [...historico].sort((a, b) => a.impacto - b.impacto)[0];

        let statusClass = 'status-reprovado';
        let statusTexto = 'Não aprovado';
        if (taxaAdmissao >= 85) {
            statusClass = 'status-aprovado';
            statusTexto = 'Aprovado';
        } else if (taxaAdmissao >= 65) {
            statusClass = 'status-analise';
            statusTexto = 'Em análise';
        }

        const conteudo = document.getElementById('conteudo-jogo');
        conteudo.innerHTML = `
            <div class="card" style="border-left-color: ${taxaAdmissao >= 85 ? '#16a34a' : taxaAdmissao >= 65 ? '#d97706' : '#dc2626'}; background-color: ${taxaAdmissao >= 85 ? '#f0fdf4' : taxaAdmissao >= 65 ? '#fffbeb' : '#fef2f2'};">
                <div class="resultado-badge ${statusClass}">${statusTexto}</div>
                <h3>${taxaAdmissao >= 85 ? '🎉 Processo aprovado' : taxaAdmissao >= 65 ? '📌 Processo em análise' : '⚠️ Processo não concluído com aprovação'}</h3>
                <p>Sua taxa final foi de <strong>${taxaAdmissao}%</strong>, com corte mínimo de 85%.</p>

                <div class="resumo-grid">
                    <div class="mini-card">
                        <span>Objetivas</span>
                        <strong>${historico.filter(item => item.tipo === 'objetiva').length}</strong>
                    </div>
                    <div class="mini-card">
                        <span>Descritivas</span>
                        <strong>${historico.filter(item => item.tipo === 'descritiva').length}</strong>
                    </div>
                    <div class="mini-card">
                        <span>Acertos</span>
                        <strong>${positivas}</strong>
                    </div>
                    <div class="mini-card">
                        <span>Perfil</span>
                        <strong>${perfis[perfilSelecionado].label}</strong>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Resumo final</h3>
                <p><strong>Melhor resposta:</strong> ${melhor ? (melhor.texto.length > 120 ? melhor.texto.substring(0, 120) + '...' : melhor.texto) : 'Sem resposta relevante'}</p>
                <p style="margin-top: 10px;"><strong>Ponto de atenção:</strong> ${pior ? (pior.texto.length > 120 ? pior.texto.substring(0, 120) + '...' : pior.texto) : 'Você manteve uma postura consistente.'}</p>
            </div>

            <button class="btn" style="text-align: center; background: linear-gradient(180deg, #16a34a, #15803d); font-weight: 800;" onclick="reiniciarJogo()">
                🔄 Refazer questionário
            </button>
        `;
    }

    function reiniciarJogo() {
        location.reload();
    }

    window.addEventListener('keydown', event => {
        if (faseJogo !== 'lobby') return;
        const tecla = event.key.toLowerCase();
        if (['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright', 'e'].includes(tecla)) {
            event.preventDefault();
            if (tecla === 'e' && !event.repeat) {
                interagirMaisProximo();
            } else {
                teclaMovimento.add(tecla);
            }
        }
    });

    window.addEventListener('keyup', event => {
        teclaMovimento.delete(event.key.toLowerCase());
    });

    window.addEventListener('blur', () => teclaMovimento.clear());

    embaralharTodasOpcoes();
    atualizarBarra();
    renderInicio();
</script>

</body>
</html>
